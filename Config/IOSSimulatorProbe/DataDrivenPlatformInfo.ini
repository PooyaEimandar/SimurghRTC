; Headless lifecycle probe only. UE 5.8.3's iOS NullRHI uses the generic
; PCD3D_SM5 name with -sm5, but iOS packages omit that platform metadata.
; NullRHI needs its feature level even though it does not execute shaders.
[ShaderPlatform PCD3D_SM5]
Language=D3D
MaxFeatureLevel=SM5
ShaderFormat=PCD3D_SM5
